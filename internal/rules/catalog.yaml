# reclaim rule catalog
# Each rule defines a cleanable target with safety information.
#
# safety: safe         - regenerates automatically, no impact
#         confirm      - safe but worth confirming (e.g. profile data)
#         dangerous    - irreversible, requires explicit opt-in

categories:
  - id: build-caches
    name: Build caches
    description: Compiler/builder caches that regenerate on next build

  - id: package-caches
    name: Package manager caches
    description: Downloaded package archives, regenerate on next install

  - id: project-caches
    name: Project build artifacts
    description: Per-project build output and dependency folders

  - id: ide-caches
    name: IDE & editor caches
    description: Build output and indexes from IDEs (Xcode, VS Code, JetBrains)

  - id: container-caches
    name: Container runtimes
    description: Docker, Podman, Colima, Lima virtual disks and images

  - id: testing-caches
    name: Testing tool caches
    description: Browser binaries and engines downloaded by test runners

  - id: browser-caches
    name: Browser caches
    description: Browser asset caches (does not log you out)

  - id: app-data
    name: App data & profiles
    description: Application support folders — review before deleting

  - id: system-caches
    name: System caches
    description: Various macOS and tool caches

rules:
  # ---------- Build caches ----------
  - id: gradle-cache
    category: build-caches
    paths:
      - ~/.gradle/caches
      - ~/.gradle/wrapper
      - ~/.gradle/daemon
    safety: safe
    regenerates: true
    description: Gradle build cache, wrapper, and daemon. Regenerates on next Android/Gradle build.
    detect: dir-exists

  - id: maven-cache
    category: build-caches
    paths:
      - ~/.m2/repository
    safety: safe
    regenerates: true
    description: Maven local repository. Regenerates on next Maven build.
    detect: dir-exists

  - id: go-build-cache
    category: build-caches
    paths:
      - ~/Library/Caches/go-build
    safety: safe
    regenerates: true
    description: Go build cache. Regenerates on next go build.
    detect: dir-exists

  - id: rustup
    category: build-caches
    paths:
      - ~/.rustup
    safety: confirm
    regenerates: false
    description: Rust toolchains. Reinstall via rustup if you use Rust.
    detect: dir-exists

  - id: cargo-cache
    category: build-caches
    paths:
      - ~/.cargo/registry
      - ~/.cargo/git
    safety: safe
    regenerates: true
    description: Cargo registry/git caches. Regenerates on next cargo build.
    detect: dir-exists

  # ---------- Package manager caches ----------
  - id: npm-cache
    category: package-caches
    paths:
      - ~/.npm/_cacache
    safety: safe
    regenerates: true
    cmd: npm cache clean --force
    description: npm package cache. Regenerates on next npm install.
    detect: dir-exists

  - id: yarn-cache
    category: package-caches
    paths:
      - ~/.yarn/cache
      - ~/Library/Caches/Yarn
    safety: safe
    regenerates: true
    description: Yarn package cache.
    detect: dir-exists

  - id: pnpm-store
    category: package-caches
    paths:
      - ~/.pnpm-store
      - ~/Library/pnpm/store
    safety: safe
    regenerates: true
    description: pnpm content-addressable store.
    detect: dir-exists

  - id: pip-cache
    category: package-caches
    paths:
      - ~/Library/Caches/pip
      - ~/.cache/pip
    safety: safe
    regenerates: true
    description: pip download cache. Regenerates on next pip install.
    detect: dir-exists

  - id: uv-cache
    category: package-caches
    paths:
      - ~/.cache/uv
      - ~/Library/Caches/uv
    safety: safe
    regenerates: true
    description: uv (modern pip) cache.
    detect: dir-exists

  - id: poetry-cache
    category: package-caches
    paths:
      - ~/Library/Caches/pypoetry
      - ~/.cache/pypoetry
    safety: safe
    regenerates: true
    description: Poetry package cache.
    detect: dir-exists

  - id: pub-cache
    category: package-caches
    paths:
      - ~/.pub-cache
    safety: safe
    regenerates: true
    cmd: dart pub cache clean
    description: Dart/Flutter package cache. Regenerates on next pub get.
    detect: dir-exists

  - id: cocoapods-cache
    category: package-caches
    paths:
      - ~/Library/Caches/CocoaPods
      - ~/.cocoapods
    safety: safe
    regenerates: true
    description: CocoaPods dependency cache.
    detect: dir-exists

  - id: homebrew-cache
    category: package-caches
    paths:
      - ~/Library/Caches/Homebrew
    safety: safe
    regenerates: true
    cmd: brew cleanup --prune=all
    description: Homebrew downloads cache. Cleaned via brew cleanup.
    detect: dir-exists

  # ---------- Project caches (scanned dynamically) ----------
  - id: project-node-modules
    category: project-caches
    scan_for: node_modules
    scan_root: ~/Desktop/Projects
    scan_max_depth: 5
    safety: confirm
    regenerates: true
    description: node_modules folders in projects (regenerates via npm/yarn/pnpm install)
    detect: scan
    activity_check: true   # check git mtime to flag stale projects

  - id: project-next
    category: project-caches
    scan_for: .next
    scan_root: ~/Desktop/Projects
    scan_max_depth: 5
    safety: safe
    regenerates: true
    description: Next.js build output (.next folders)
    detect: scan

  - id: project-open-next
    category: project-caches
    scan_for: .open-next
    scan_root: ~/Desktop/Projects
    scan_max_depth: 5
    safety: safe
    regenerates: true
    description: OpenNext build output (.open-next folders)
    detect: scan

  - id: project-dart-tool
    category: project-caches
    scan_for: .dart_tool
    scan_root: ~/Desktop/Projects
    scan_max_depth: 5
    safety: safe
    regenerates: true
    description: Flutter/Dart build cache (.dart_tool folders)
    detect: scan

  - id: project-pods
    category: project-caches
    scan_for: Pods
    scan_root: ~/Desktop/Projects
    scan_max_depth: 6
    path_contains: ios
    safety: safe
    regenerates: true
    description: CocoaPods install (ios/Pods folders)
    detect: scan

  - id: project-android-gradle
    category: project-caches
    scan_for: .gradle
    scan_root: ~/Desktop/Projects
    scan_max_depth: 5
    path_contains: android
    safety: safe
    regenerates: true
    description: Per-project Gradle cache (android/.gradle)
    detect: scan

  - id: python-pycache
    category: project-caches
    scan_for: __pycache__
    scan_root: ~/Desktop/Projects
    scan_max_depth: 8
    safety: safe
    regenerates: true
    description: Python bytecode cache directories
    detect: scan

  - id: python-venv
    category: project-caches
    scan_for: ".venv|venv"
    scan_root: ~/Desktop/Projects
    scan_max_depth: 4
    safety: confirm
    regenerates: true
    description: Python virtual environments
    detect: scan

  - id: rust-target
    category: project-caches
    scan_for: target
    scan_root: ~/Desktop/Projects
    scan_max_depth: 4
    requires_sibling: Cargo.toml
    safety: safe
    regenerates: true
    description: Rust build output (target/) — only deleted next to Cargo.toml
    detect: scan

  # ---------- IDE / Xcode ----------
  - id: xcode-derived-data
    category: ide-caches
    paths:
      - ~/Library/Developer/Xcode/DerivedData
    safety: safe
    regenerates: true
    description: Xcode build cache. Regenerates on next build (cold build is slower).
    detect: dir-exists

  - id: xcode-device-support
    category: ide-caches
    paths:
      - ~/Library/Developer/Xcode/iOS DeviceSupport
      - ~/Library/Developer/Xcode/watchOS DeviceSupport
      - ~/Library/Developer/Xcode/tvOS DeviceSupport
    safety: safe
    regenerates: true
    description: Xcode device debug symbols. Re-downloaded when you connect a device.
    detect: dir-exists

  - id: xcode-archives
    category: ide-caches
    paths:
      - ~/Library/Developer/Xcode/Archives
    safety: confirm
    regenerates: false
    description: Xcode build archives (used for App Store submission). Don't delete recent ones.
    detect: dir-exists

  - id: ios-simulators-unavailable
    category: ide-caches
    cmd: xcrun simctl delete unavailable
    safety: safe
    description: Remove iOS simulators left behind from old Xcode versions.
    detect: command

  - id: vscode-extension-cache
    category: ide-caches
    paths:
      - ~/Library/Application Support/Code/CachedExtensionVSIXs
      - ~/Library/Application Support/Code/CachedData
    safety: safe
    regenerates: true
    description: VS Code extension install cache.
    detect: dir-exists

  - id: jetbrains-caches
    category: ide-caches
    paths:
      - ~/Library/Caches/JetBrains
    safety: safe
    regenerates: true
    description: JetBrains IDEs (IntelliJ, WebStorm, etc.) cache.
    detect: dir-exists

  # ---------- Containers ----------
  - id: docker-vm
    category: container-caches
    paths:
      - ~/Library/Containers/com.docker.docker/Data/vms
    safety: confirm
    regenerates: true
    process_check: Docker
    description: Docker Desktop virtual disk (images, containers, volumes). Quit Docker before deleting.
    detect: dir-exists

  # ---------- Browsers ----------
  - id: chrome-cache
    category: browser-caches
    paths:
      - ~/Library/Caches/Google
    safety: safe
    regenerates: true
    description: Chrome cache (asset cache only — does NOT log you out)
    detect: dir-exists

  - id: arc-cache
    category: browser-caches
    paths:
      - ~/Library/Caches/Arc
    safety: safe
    regenerates: true
    description: Arc browser cache
    detect: dir-exists

  # ---------- AI / ML ----------
  - id: huggingface-cache
    category: package-caches
    paths:
      - ~/.cache/huggingface
    safety: safe
    regenerates: true
    description: Hugging Face downloaded models (large — re-downloaded on demand)
    detect: dir-exists

  - id: ollama-cache
    category: package-caches
    paths:
      - ~/Library/Caches/ollama
    safety: confirm
    regenerates: true
    description: Ollama model cache (re-downloaded on next pull)
    detect: dir-exists

  - id: torch-cache
    category: package-caches
    paths:
      - ~/.cache/torch
    safety: safe
    regenerates: true
    description: PyTorch model cache
    detect: dir-exists

  # ---------- System / misc ----------
  - id: trash
    category: system-caches
    paths:
      - ~/.Trash
    safety: confirm
    regenerates: false
    description: Items in Trash (permanently deleted)
    detect: dir-exists

  # ---------- Testing tool caches ----------
  - id: puppeteer-cache
    category: testing-caches
    paths:
      - ~/.cache/puppeteer
    safety: safe
    regenerates: true
    description: Puppeteer's bundled Chromium downloads
    detect: dir-exists

  - id: playwright-cache
    category: testing-caches
    paths:
      - ~/Library/Caches/ms-playwright
      - ~/.cache/ms-playwright
      - ~/Library/Caches/ms-playwright-go
    safety: safe
    regenerates: true
    description: Playwright browser binaries
    detect: dir-exists

  - id: cypress-cache
    category: testing-caches
    paths:
      - ~/Library/Caches/Cypress
    safety: safe
    regenerates: true
    description: Cypress downloaded test runner binaries
    detect: dir-exists

  - id: prisma-cache
    category: testing-caches
    paths:
      - ~/.cache/prisma
    safety: safe
    regenerates: true
    description: Prisma engine binary cache
    detect: dir-exists

  # ---------- Build caches: additions (v0.2) ----------
  - id: gradle-native-cache
    category: build-caches
    paths:
      - ~/.gradle/native
    safety: safe
    regenerates: true
    description: Gradle native compilation cache
    detect: dir-exists

  - id: ivy2-cache
    category: build-caches
    paths:
      - ~/.ivy2/cache
    safety: safe
    regenerates: true
    description: Apache Ivy / SBT dependency cache
    detect: dir-exists

  - id: sbt-boot
    category: build-caches
    paths:
      - ~/.sbt/boot
    safety: safe
    regenerates: true
    description: SBT (Scala) bootstrap launchers
    detect: dir-exists

  - id: go-module-cache
    category: build-caches
    paths:
      - ~/go/pkg/mod
    safety: confirm
    regenerates: true
    description: Go module cache. Re-downloaded on next build (can be slow for many modules).
    detect: dir-exists

  - id: bazel-cache
    category: build-caches
    paths:
      - ~/.cache/bazel
    safety: safe
    regenerates: true
    description: Bazel build cache
    detect: dir-exists

  - id: turbo-cache
    category: build-caches
    paths:
      - ~/.cache/turbo
    safety: safe
    regenerates: true
    description: Turborepo remote cache directory
    detect: dir-exists

  - id: dart-server-cache
    category: build-caches
    paths:
      - ~/.dartServer
    safety: safe
    regenerates: true
    description: Dart Analysis Server cache
    detect: dir-exists

  - id: android-build-cache
    category: build-caches
    paths:
      - ~/.android/build-cache
    safety: safe
    regenerates: true
    description: Android build-cache directory
    detect: dir-exists

  # ---------- Package manager caches: additions (v0.2) ----------
  - id: npm-logs
    category: package-caches
    paths:
      - ~/.npm/_logs
    safety: safe
    regenerates: false
    description: npm error/install logs
    detect: dir-exists

  - id: yarn-berry-cache
    category: package-caches
    paths:
      - ~/.yarn/berry/cache
    safety: safe
    regenerates: true
    description: Yarn 2+ (Berry) global cache
    detect: dir-exists

  - id: bun-install-cache
    category: package-caches
    paths:
      - ~/.bun/install/cache
    safety: safe
    regenerates: true
    description: Bun package install cache
    detect: dir-exists

  - id: deno-cache
    category: package-caches
    paths:
      - ~/.deno/deps
      - ~/.deno/gen
    safety: safe
    regenerates: true
    description: Deno module and codegen cache
    detect: dir-exists

  - id: pipenv-cache
    category: package-caches
    paths:
      - ~/.cache/pipenv
    safety: safe
    regenerates: true
    description: Pipenv dependency cache
    detect: dir-exists

  - id: conda-pkgs
    category: package-caches
    paths:
      - ~/.conda/pkgs
      - ~/anaconda3/pkgs
      - ~/miniconda3/pkgs
    safety: confirm
    regenerates: true
    description: Conda package tarball cache (re-download required after delete)
    detect: dir-exists

  - id: gem-cache
    category: package-caches
    paths:
      - ~/.gem/cache
    safety: safe
    regenerates: true
    description: RubyGems download cache
    detect: dir-exists

  - id: composer-cache
    category: package-caches
    paths:
      - ~/.composer/cache
    safety: safe
    regenerates: true
    description: Composer (PHP) package cache
    detect: dir-exists

  - id: nuget-packages
    category: package-caches
    paths:
      - ~/.nuget/packages
    safety: confirm
    regenerates: true
    description: NuGet (.NET) global package cache
    detect: dir-exists

  - id: carthage-cache
    category: package-caches
    paths:
      - ~/Library/Caches/org.carthage.CarthageKit
    safety: safe
    regenerates: true
    description: Carthage download cache
    detect: dir-exists

  - id: nvm-cache
    category: package-caches
    paths:
      - ~/.nvm/.cache
    safety: safe
    regenerates: true
    description: nvm downloaded node tarball cache
    detect: dir-exists

  - id: aws-cli-cache
    category: package-caches
    paths:
      - ~/.aws/cli/cache
    safety: safe
    regenerates: true
    description: AWS CLI SSO/role cache
    detect: dir-exists

  - id: terraform-plugin-cache
    category: package-caches
    paths:
      - ~/.terraform.d/plugin-cache
    safety: safe
    regenerates: true
    description: Terraform shared provider plugin cache
    detect: dir-exists

  # ---------- IDE / editor additions (v0.2) ----------
  - id: xcode-previews
    category: ide-caches
    paths:
      - ~/Library/Developer/Xcode/UserData/Previews
    safety: safe
    regenerates: true
    description: Xcode SwiftUI Preview cache
    detect: dir-exists

  - id: xcode-ios-device-logs
    category: ide-caches
    paths:
      - ~/Library/Developer/Xcode/iOS Device Logs
    safety: safe
    regenerates: true
    description: Logs pulled from connected iOS devices
    detect: dir-exists

  - id: coresimulator-caches
    category: ide-caches
    paths:
      - ~/Library/Developer/CoreSimulator/Caches
    safety: safe
    regenerates: true
    description: CoreSimulator temporary caches
    detect: dir-exists

  - id: cursor-caches
    category: ide-caches
    paths:
      - ~/Library/Application Support/Cursor/Cache
      - ~/Library/Application Support/Cursor/CachedData
      - ~/Library/Application Support/Cursor/Code Cache
      - ~/Library/Application Support/Cursor/GPUCache
      - ~/Library/Application Support/Cursor/logs
    safety: safe
    regenerates: true
    description: Cursor IDE caches and logs (NOT extensions or settings)
    detect: dir-exists

  - id: windsurf-caches
    category: ide-caches
    paths:
      - ~/Library/Application Support/Windsurf/Cache
      - ~/Library/Application Support/Windsurf/CachedData
      - ~/Library/Application Support/Windsurf/Code Cache
      - ~/Library/Application Support/Windsurf/GPUCache
    safety: safe
    regenerates: true
    description: Windsurf IDE caches
    detect: dir-exists

  - id: zed-cache
    category: ide-caches
    paths:
      - ~/Library/Caches/dev.zed.Zed
    safety: safe
    regenerates: true
    description: Zed editor cache
    detect: dir-exists

  - id: vscode-logs
    category: ide-caches
    paths:
      - ~/Library/Application Support/Code/logs
    safety: safe
    regenerates: false
    description: VS Code logs
    detect: dir-exists

  - id: jetbrains-logs
    category: ide-caches
    paths:
      - ~/Library/Logs/JetBrains
    safety: safe
    regenerates: false
    description: JetBrains IDE logs
    detect: dir-exists

  - id: android-avd-unused
    category: ide-caches
    paths:
      - ~/.android/avd
    safety: confirm
    regenerates: true
    description: Android Virtual Devices. Each AVD is 5–10 GB; deleting wipes app state inside the emulator.
    detect: dir-exists

  - id: android-system-images-stale
    category: ide-caches
    paths:
      - ~/Library/Android/sdk/system-images
    safety: confirm
    regenerates: true
    description: Android SDK system images for emulators. Re-downloading API levels takes time.
    detect: dir-exists

  - id: fvm-versions-stale
    category: ide-caches
    paths:
      - ~/fvm/versions
    safety: confirm
    regenerates: true
    description: fvm-managed Flutter SDKs. Re-downloading is 1–2 GB per version.
    detect: dir-exists

  - id: ipsw-firmware
    category: ide-caches
    paths:
      - ~/Library/iTunes/iPhone Software Updates
      - ~/Library/iTunes/iPad Software Updates
    safety: confirm
    regenerates: true
    description: Old iOS/iPadOS firmware downloaded by iTunes/Finder
    detect: dir-exists

  # ---------- Container additions (v0.2) ----------
  - id: docker-system-prune
    category: container-caches
    safety: confirm
    regenerates: true
    description: Run `docker system prune` to drop dangling images, stopped containers, build cache, and unused networks (volumes preserved)
    detect: command
    detect_command: "docker info >/dev/null 2>&1"
    action: shell
    action_command: "docker system prune -f --filter until=720h"

  - id: docker-buildx-cache
    category: container-caches
    paths:
      - ~/.docker/buildx/cache
    safety: safe
    regenerates: true
    description: Docker BuildKit cache (filesystem-side; daemon prune is separate)
    detect: dir-exists

  - id: colima-vm
    category: container-caches
    paths:
      - ~/.colima
    safety: confirm
    regenerates: true
    process_check: colima
    description: Colima Lima VM disk images. Stop Colima first; each VM is 5–20 GB.
    detect: dir-exists

  - id: lima-vm
    category: container-caches
    paths:
      - ~/.lima
    safety: confirm
    regenerates: true
    process_check: limactl
    description: Lima VM disk images
    detect: dir-exists
